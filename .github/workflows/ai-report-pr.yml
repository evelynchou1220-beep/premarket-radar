# 雲端 AI 產出的自動發布（CLAUDE.md §7.5、§7.6）。AI 一律推到分支，不直接改 main：
# - claude/ai-report-<日期>：07:20 晨報（AI 完整版報告＋今早新聞重點）。只能改報告、快照、data/briefs/，且必須在當天 09:00 前
#   （開盤後才發布等於看了行情才公開，戰績就不誠實）
# - claude/recap-<日期>：收盤後的 AI 盤後分析。只能改 data/recaps/，當天內發布
# 檢查都通過 → 自動合併進 main 並部署；任一項沒通過 → 不發布、刪除分支
name: AI publish

on:
  push:
    branches: ['claude/ai-report-**', 'claude/recap-**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: kind
        name: 判斷類型
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            claude/ai-report-*) echo "day=${BRANCH#claude/ai-report-}" >> "$GITHUB_OUTPUT"; echo "allow=^(src/content/reports/|data/snapshots/|data/briefs/)" >> "$GITHUB_OUTPUT"; echo "deadline=08:59" >> "$GITHUB_OUTPUT" ;;
            claude/recap-*) echo "day=${BRANCH#claude/recap-}" >> "$GITHUB_OUTPUT"; echo "allow=^data/recaps/" >> "$GITHUB_OUTPUT"; echo "deadline=23:59" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: 接到最新的 main 之後
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: 檢查修改範圍
        env:
          ALLOW: ${{ steps.kind.outputs.allow }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -vE "$ALLOW" || true)
          if [ -n "$BAD" ]; then echo "❌ 修改了不允許的檔案：$BAD"; exit 1; fi
      - run: npm ci
      - name: 驗收
        run: npm run check
      - name: 時限內才發布
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
          DAY: ${{ steps.kind.outputs.day }}
          DEADLINE: ${{ steps.kind.outputs.deadline }}
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F); NOW=$(TZ=Asia/Taipei date +%H:%M)
          if [ "$DAY" != "$TODAY" ] || [[ "$NOW" > "$DEADLINE" ]]; then
            echo "⏰ 現在 $TODAY $NOW，$DAY 的內容已超過發布時限（$DEADLINE），不發布。"
            git push origin --delete "$BRANCH" || true
            exit 1
          fi
          git push origin HEAD:main
          git push origin --delete "$BRANCH" || true
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✅ $NOW 已發布 $BRANCH"

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    # 用 GITHUB_TOKEN push 不會觸發 deploy.yml 的 push 事件，所以直接呼叫部署流程
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
