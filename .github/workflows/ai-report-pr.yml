# 雲端 AI 晨報自動發布（CLAUDE.md §7.5）：
# 1. 雲端 AI 把升級後的報告推到 claude/ai-report-<日期> 分支（AI 不直接改 main）
# 2. 這裡檢查「只改了報告與快照」、npm run check 通過，且現在是當天台北時間 09:00 以前
# 3. 全部通過 → 自動合併進 main 並部署；任一項沒通過 → 不發布、刪除分支（網站維持程式版）
# 開盤後才發布等於看了行情才公開，戰績就不誠實，所以 09:00 是硬性截止時間。
name: AI report publish

on:
  push:
    branches: ['claude/ai-report-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 接到最新的 main 之後
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: 只允許修改報告與快照
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -vE '^(src/content/reports/|data/snapshots/)' || true)
          if [ -n "$BAD" ]; then echo "❌ 修改了報告與快照以外的檔案：$BAD"; exit 1; fi
      - run: npm ci
      - name: 驗收所有報告
        run: npm run check
      - name: 09:00 前才發布
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          DAY="${BRANCH#claude/ai-report-}"
          TODAY=$(TZ=Asia/Taipei date +%F); NOW=$(TZ=Asia/Taipei date +%H:%M)
          if [ "$DAY" != "$TODAY" ] || [[ "$NOW" > "08:59" ]]; then
            echo "⏰ 現在 $TODAY $NOW，晨報 $DAY 已超過 09:00 截止，不發布。"
            git push origin --delete "$BRANCH" || true
            exit 1
          fi
          git push origin HEAD:main
          git push origin --delete "$BRANCH" || true
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✅ $NOW 已發布 $DAY AI 完整版"

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    # 用 GITHUB_TOKEN push 不會觸發 deploy.yml 的 push 事件，所以直接呼叫部署流程
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
