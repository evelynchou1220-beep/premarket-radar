# 每日排程（CLAUDE.md §7）：開盤日早上產生程式版預測、收盤後對答案，有變動就 commit 並重新部署。
# GitHub 的 cron 使用 UTC 時間，且尖峰時段可能延遲 10～30 分鐘，所以提早排在整點前。
name: Daily predict & verify

on:
  schedule:
    # GitHub 排程曾延遲 4 小時以上，所以盤前預測排兩次：先跑成功的就完成，後面那次自動略過；09:00 後一律不產生（daily.mjs）
    - cron: '40 21 * * 0-4' # 台北時間週一～五 05:40：盤前預測（美股已收盤、夜盤已結束）
    - cron: '40 22 * * 0-4' # 台北時間週一～五 06:40：盤前預測備援
    - cron: '10 8 * * 1-5'  # 台北時間週一～五 16:10：收盤後對答案＋盤後數據（證交所法人、期交所部位約 15:00 後才公布；不產生預測）
  workflow_dispatch:
    inputs:
      task:
        description: '要執行的工作'
        type: choice
        options: [predict, verify, postclose]
        default: predict

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: task
        name: 判斷工作
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 8 * * 1-5" ]; then
            echo "task=postclose" >> "$GITHUB_OUTPUT"
          else
            echo "task=predict" >> "$GITHUB_OUTPUT"
          fi
      - name: 更新股票代號對照表
        if: steps.task.outputs.task == 'predict'
        run: npm run stocklist || echo "對照表更新失敗，沿用舊檔"
      - name: 執行 ${{ steps.task.outputs.task }}
        run: npm run daily -- ${{ steps.task.outputs.task }}
      - name: 驗收所有報告
        run: npm run check
      - id: commit
        name: 提交結果
        env:
          TASK: ${{ steps.task.outputs.task }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data src/content
          if git diff --cached --quiet; then
            echo "沒有變動（休市或尚無新資料）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAY=$(TZ=Asia/Taipei date +%F)
          if [ "$TASK" = "predict" ]; then MSG="report: $DAY 程式版（排程）"; else MSG="verify: $DAY＋盤後數據（排程）"; fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: run
    if: needs.run.outputs.changed == 'true'
    # 用 GITHUB_TOKEN push 不會觸發 deploy.yml 的 push 事件，所以直接呼叫部署流程
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
